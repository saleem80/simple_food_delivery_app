{% extends 'base.html' %}

{% block title %}Verify OTP - Food Delivery{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card">
            <div class="card-header text-center">
                <h3>Verify OTP</h3>
            </div>
            <div class="card-body">
                <p class="text-center mb-3">
                    We've sent an OTP to <strong>{{ mobile_number }}</strong>
                </p>
                
                <form method="post">
                    {% csrf_token %}
                    <div class="form-group">
                        <label for="{{ form.otp.id_for_label }}" class="form-label">Enter OTP</label>
                        {{ form.otp }}
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Verify & Login</button>
                </form>
                
                <div class="text-center mt-3">
                    <small class="text-muted">
                        <strong>Demo OTP:</strong> 1234
                    </small>
                </div>
                
                <div class="text-center mt-2">
                    <a href="{% url 'login' %}" class="btn btn-secondary btn-sm">Back to Login</a>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
.row {
    display: flex;
    justify-content: center;
    margin: 2rem 0;
}

.col-md-6 {
    width: 100%;
    max-width: 500px;
}
</style>
{% endblock %}
